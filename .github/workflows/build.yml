name: Build

on:
  push:
    branches:
      - main
      - improve/project-foundation
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore OpenSSTP.sln

      - name: Build Release
        run: msbuild OpenSSTP.sln /m /p:Configuration=Release /p:SignManifests=false
